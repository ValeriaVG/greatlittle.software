name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo run
      - run: cargo install worker-build
      # Workaround: worker-build passes --force-enable-abort-handler to wasm-bindgen,
      # but wasm-bindgen >= 0.2.100 removed this flag (abort handling is now default).
      # Install wasm-bindgen-cli and wrap it to strip the obsolete flag.
      # worker-build respects WASM_BINDGEN_BIN env var (checked before downloading its own copy).
      - run: |
          cargo install wasm-bindgen-cli --version 0.2.125
          mv "$HOME/.cargo/bin/wasm-bindgen" "$HOME/.cargo/bin/wasm-bindgen-real"
          cat > "$HOME/.cargo/bin/wasm-bindgen" << 'WRAPPER'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            if [ "$arg" != "--force-enable-abort-handler" ]; then
              args+=("$arg")
            fi
          done
          exec "$HOME/.cargo/bin/wasm-bindgen-real" "${args[@]}"
          WRAPPER
          chmod +x "$HOME/.cargo/bin/wasm-bindgen"
      - uses: cloudflare/wrangler-action@v3
        env:
          WASM_BINDGEN_BIN: wasm-bindgen
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
